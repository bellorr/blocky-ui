name: Preview Build

on:
  push:
    branches:
      - fork/preview
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/bellorr/blocky-ui

jobs:
  build-and-push:
    name: Build and Push Preview Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Mirrors the upstream publish-docker-image action: the Dockerfile's
      # native-sqlite stage requires this ARG and fails the build if it is empty.
      - name: Resolve native dependency versions
        id: native-dependencies
        shell: bash
        run: |
          set -euo pipefail
          better_sqlite3="$(jq -er '.dependencies["better-sqlite3"] | select(type == "string")' package.json)"
          echo "better_sqlite3=${better_sqlite3}" >> "${GITHUB_OUTPUT}"

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            BETTER_SQLITE3_VERSION=${{ steps.native-dependencies.outputs.better_sqlite3 }}
            BUILDER_PLATFORM=linux/amd64
          tags: ${{ env.IMAGE }}:victorialogs-preview
          cache-from: type=gha
          cache-to: type=gha,mode=max
